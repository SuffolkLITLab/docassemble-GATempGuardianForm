    required: False
  - label: "Address of Mother's Spouse"
    field: mothers1_spouse_address
    required: False
    input type: area
  - label: Is the Mother deceased?
    field: mothers1_deceased_yes
    datatype: yesnoradio
  - "Has the Mother signed a consent for the creation of this temporary guardianship?": mothers1_signed_consent_yes
    datatype: yesnoradio
  - "Is the Mother’s address known and listed above?": motherss1_address_listed_yes
    datatype: yesnoradio
  - "Have the Mother’s rights been terminated via Court Order?": mothers1_rights_terminated_yes
    datatype: yesnoradio
  - "Has the Mother lost custody via Court Order?": mother_lost_custody_yes
    datatype: yesnoradio
  - "Does the Mother have joint legal custody via Court Order?": mother_joint_custody_yes
    datatype: yesnoradio
  - "Does the Mother have sole legal custody via Court Order?": mother_sole_custody_yes
    datatype: yesnoradio
  - "Was the Mother married to the Father of the child during or after the conception of the Child?": mother_father_married_yes
    datatype: yesnoradio
  - "Was the Mother married to another during the conception, gestation or birth of the Child?": mother_other_married_yes
    datatype: yesnoradio
