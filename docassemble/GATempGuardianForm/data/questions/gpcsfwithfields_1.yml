    users.appendObject()
    second_guardian_information
    second_guardian_address
    second_guardian_phone
  children.appendObject()
  child_name
  child_address
  child_birthdate
  if minor_age_14_yes:
    minor_selection_form_notice
  user_relationship
  mothers.appendObject()
  mother_information
  mother_address
  mother_phone
  mother_deceased
  if not mothers1_deceased_yes:
    mother_consent_custody
    if not mothers1_rights_terminated_yes:
      mother_legal_custody
      if mother_lost_custody:
        mother_sole_custody = True
        mother_joint_custody = True
  mother_marital_status
  if mother_other_married_yes:
    mother_spouse_information
  fathers.appendObject()
  father_information
  father_deceased
  if not father_deceased_yes:
    father_consent_custody
    father_legal_custody
    if father_lost_custody:
      father_sole_custody = True
      father_joint_custody = True
  set_progress(50)
  nav.set_section('case_details')
  guardianship_details
  additional_data
  attorney_yes_no
  if has_attorney:
    attorneys.appendObject()
    attorney_information
  case_information
  set_progress(75)
  if not defined('people_lists_built'):
    users.gathered = True
    children.gathered = True
    mothers.gathered = True
    fathers.gathered = True
    attorneys.gathered = True
    people_lists_built = True
  set_progress(88)
  store_variables_snapshot( persistent=True, data={ "zip": showifdef("users[0].address.zip"), "reached_interview_end": True, }, )
  gpcsfwithfields_1_preview_question
  set_progress(100)
  gpcsfwithfields_1_download
  
---
id: GPCSF with fields 1 intro
question: "Petition For Temporary Letters of Guardianship of Minor in Georgia"
subquestion: |2+
  ## What is this form?
  You can use this form if you need to temporarily care for a child and have the consent of the child's parents. If a parent is not giving their consent, the court will not process this form. 
  
  ## Who should be filling out this form?
  - This form should be filled out by the person who wants to be the temporary guardian of the child. 
  
  ### To fill in the form:
  - You'll need information about the child and their parents.
  - If you have any additional documents (like a custody order or parent's death certificate), you can include a copy of them with the form. 
  
  ### When you are finished
  - Check your answers and print this form.
  - You must sign this form in front of a notary.
  - File the completed form with the Probate Court in the county where you live.
  - Keep a copy for yourself. 
  
  
continue button field: gpcsfwithfields_1_intro
---
id: Consent
question: "Before you fill out this form:"
subquestion: |2-
  **To file this form, you must have consent of the parent(s) of the minor.**
  
  If a parent is not willing to sign consent for you to become the child's temporary guardian, then the court will not accept the form.

continue button field: consent
---
