id: download_gpcsfwithfields_1
event: gpcsfwithfields_1_download
question: "Your form is ready."
subquestion: |2
  Thank you ${users[0].name}. Your form is ready to download and print.
  
  Use the options below to view, download, or send your form. Select ‘Edit answers’ to make changes.
  
  ${ action_button_html(url_action('review_gpcsfwithfields_1'), label=word('Edit answers'), color='info') }
  
  ${ al_user_bundle.download_list_html() }
  
  ${ al_user_bundle.send_button_html(show_editable_checkbox=False) }
progress: 100
---
# ALDocument objects specify the metadata for each template
objects:
  - gpcsfwithfields_1_Post_interview_instructions: ALDocument.using(filename="gpcsfwithfields_1_next_steps.docx", enabled=al_next_steps_enabled, has_addendum=False)
  - gpcsfwithfields_1_attachment: ALDocument.using(filename="gpcsfwithfields_1", enabled=True, has_addendum=False)
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[gpcsfwithfields_1_Post_interview_instructions, gpcsfwithfields_1_attachment], filename="gpcsfwithfields_1", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[gpcsfwithfields_1_attachment], filename="gpcsfwithfields_1", enabled=True)
---
template: gpcsfwithfields_1_Post_interview_instructions.title
content: |
  Instructions
---
template: gpcsfwithfields_1_attachment.title
content: |
  GPCSF-with-fields (1)
---
template: al_user_bundle.title
content: |
  All forms to download for your records
---
template: al_court_bundle.title
content: |
  All forms to deliver to court
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the
# same template is used for "preview" and "final" keys, and logic in the template checks
# the value of `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: gpcsfwithfields_1_next_steps
  docx template file: gpcsfwithfields_1_next_steps.docx
  variable name: gpcsfwithfields_1_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
