id: gpcsfwithfields_1_review_screen
event: review_gpcsfwithfields_1
question: |
  Review your answers
subquestion: |
  Check your answers below. Click Edit to change your guardian information.
review:
  - Edit: users.revisit
    button: |
      **Your information**
     
      Name: ${ users[0] }
      
      Address: ${ users[0].address }
      
      Phone: ${ users[0].phone_number }
      
  - Edit: second_guardian_information
    button: |
      **Second guardian information**
     
      Name: ${ users[1] }
      
      Address: ${ users[1].address }
      
      Phone: ${ users[1].phone_number }
      
    condition: has_second_guardian
  - Edit: children.revisit
    button: |
      **Child's information**
     
      Name: ${ children[0] }
      
      Address: ${ children[0].address }
      
      Birthdate: ${ children[0].birthdate }
      
  - Edit: user_relationship
    button: |
      **Relationship with the child**
     
      Relationship: ${ showifdef('users1_relationship_to_minor') }
      
  - Edit: mothers.revisit
    button: |
      **Mother's information**
     
      Name: ${ mothers[0] }
      
      Address: ${ mothers[0].address }
      
      Mother deceased: ${ word(yesno(mothers1_deceased_yes)) if defined('mothers1_deceased_yes') else '' }
      
      Mother consent: ${ word(yesno(mothers1_signed_consent_yes)) if defined('mothers1_signed_consent_yes') else '' }
      
  - Edit: mother_consent_custody
    button: |
      **Mother's parental rights**
     
      Rights terminated by court order: ${ word(yesno(mothers1_rights_terminated_yes)) if defined('mothers1_rights_terminated_yes') else '' }
      
  - Edit: mother_legal_custody
    button: |
      **Mother's legal custody**
     
      Lost custody by court order: ${ word(yesno(mother_lost_custody_yes)) if defined('mother_lost_custody_yes') else '' }
    
      Joint legal custody by court order: ${ word(yesno(mother_joint_custody_yes)) if defined('mother_joint_custody_yes') else '' }
     
      Sole legal custody by court order: ${ word(yesno(mother_sole_custody_yes)) if defined('mother_sole_custody_yes') else '' }
      
  - Edit: mother_marital_status
    button: |
      **Mother's marital status**
     
      Married to the father during or after conception: ${ word(yesno(mother_father_married_yes)) if defined('mother_father_married_yes') else '' }
     
      Married to another person during conception or birth: ${ word(yesno(mother_other_married_yes)) if defined('mother_other_married_yes') else '' }
  - Edit: mother_spouse_information
    button: |
      **Mother's spouse information**
     
      Spouse's name: ${ showifdef('mothers1_spouse_name_full') }
     
      Spouse's address: ${ showifdef('mothers1_spouse_address') }   
    condition: mother_other_married_yes
  - Edit: fathers.revisit
    button: |
      **Father's Information**
     
      Name: ${ fathers[0] }
      
      Address: ${ fathers[0].address }
      
      Has Father died: ${ word(yesno(fathers1_deceased_yes)) if defined('fathers1_deceased_yes') else '' }
     
      Father's consent: ${ word(yesno(fathers1_signed_consent_yes)) if defined('fathers1_signed_consent_yes') else '' }
  - Edit: father_consent_custody
    button: |
      **Father's parental rights**
     
      Have the Father's rights been terminated by a Court Order? 
      ${ fathers_rights_terminated_yes }
  - Edit: father_lost_custody
    button: |
      **Father's legal custody**
    
      Has the Father lost custody via Court Order?
      ${ word(yesno(father_lost_custody)) if defined('father_lost_custody') else '' }
      
      Does the Father have joint legal custody via Court Order?
      ${ word(yesno(father_joint_custody)) if defined('father_joint_custody') else '' }
      
      Does the Father have sole legal custody via Court Order?
      ${ word(yesno(father_sole_custody)) if defined('father_sole_custody') else '' }
  - Edit: guardianship_details
    button: |
      **Guardianship details**
      
      Reason: ${ single_paragraph(guardianship_reason) if defined('guardianship_reason') else '' }
  - Edit: additional_data
    button: |
      **Other Information**
      
      ${ single_paragraph(Additional_data) if defined('Additional_data') else '' }
  - Edit: attorneys.revisit
    button: |
      **Lawyer's information**
      
      Name: ${ attorneys[0] if has_attorney else 'No attorney entered' }
      
      Address: ${ attorneys[0].address }
      
      Phone Number: ${ attorneys[0].phone_number }
      
      Bar number: ${ showifdef('attorneys_bar_number') if has_attorney else '' }
  - Edit: case_information
    button: |
      **Court Information**
      
      County: ${ showifdef('trial_court_county') }
