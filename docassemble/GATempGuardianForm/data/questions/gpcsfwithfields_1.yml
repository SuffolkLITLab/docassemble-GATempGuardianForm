---
id: GPCSF with fields 1 intro
question: "Petition For Temporary Letters of Guardianship of Minor in Georgia"
subquestion: |2+
  ## What is this form?
  - Use this form to ask the court to name you as a child's temporary guardian. The child's parents must agree to the guardianship. If a parent does not agree, the court will not accept this petition.
  
  ## Who should be filling out this form?
  - This form is for the person who wants to become the child's temporary guardian.
  
  ### To fill in the form:
  - Have information about the child and both parents ready.
  - You may include copies of other documents, such as a custody order or a parent's death certificate. If you don't have copies of other documents, you can still file this form without them.
  
  ### When you are finished
  - Review your answers, then print the form.
  - File the form with the Probate Court in your county.
  - Keep a copy for yourself. 
  
  
continue button field: gpcsfwithfields_1_intro
---
id: Consent
question: "Before you fill out this form:"
subquestion: |2-
  **To file this form, you must have consent of the parent(s) of the minor.**
  
  The child's parents must agree to the temporary guardianship. If a parent does not agree, the court will not accept this petition.
continue button field: consent
