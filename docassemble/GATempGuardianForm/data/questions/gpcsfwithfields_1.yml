---
id: GPCSF with fields 1 intro
question: Petition For Temporary Letters of Guardianship of Minor
subquestion: |
  **In Georgia, Minor guardianships require the consent of parents. If a parent is not willing to sign consent for the petitioner to become the Guardian of their child, then the Guardianship Petition cannot be processed.**
  
  ### To complete the form:
  - Gather all necessary information about the minor and their parents.
  - Ensure you have the required documents, like the minor's birth certificate.
  
  ### When you are finished
  - Submit the completed petition to the appropriate Probate Court.
  - Ensure that all parties are notified as required by law.
  
  You can use this form if you need to temporarily care for a minor and have the necessary legal relationship with them. Make sure to notify the parents of the minor as required.
continue button field: gpcsfwithfields_1_intro
---
id: user_information
question: Temporary Guardian Information
subquestion: |
  Provide information about the person seeking to be appointed as the temporary guardian.
fields:
