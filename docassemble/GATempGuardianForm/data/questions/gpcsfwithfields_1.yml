  - "Georgia County where the Minor resides": children1_address_county
  - "Is the Minor 14 or older at the time of filing?": minor_age_14_yes
    datatype: yesnoradio
  - "Minor's age at time of filing": children1_age
    datatype: integer
continue button field: minor_information
